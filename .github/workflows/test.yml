name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flight_booking
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Build frontend
        run: make build

      - name: Run database migrations
        run: make migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flight_booking

      - name: Seed database
        run: make seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flight_booking

      - name: Run tests
        run: make test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flight_booking
